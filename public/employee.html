<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee · SignBridge</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top"><h1>🧑‍💼 Employee</h1><span class="code" id="code"></span></div>
<div class="grid" style="grid-template-columns:1fr"><div class="col"><div class="card grow" style="padding:0;min-height:0"><div class="chat" id="chat"></div></div>
<div class="chips" id="quick"></div>
<div class="card"><textarea id="txt" rows="3" placeholder="Type here, or press the microphone and speak. You can edit the text before sending."></textarea>
<div class="row" style="margin-top:8px"><button id="mic" class="ghost">🎤 Speak</button><span class="mut" id="st"></span><span class="grow"></span><button class="ghost" id="clr">Clear</button><button id="send" class="ok">Send ➤</button></div></div></div></div>
<div class="over" id="over">Chat ended</div><script src="app.js"></script><script src="employee.js"></script></body></html>
